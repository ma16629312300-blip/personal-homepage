<head>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #000; font-family: 'Playfair Display', serif; touch-action: none; }
    #canvas-container { width: 100vw; height: 100vh; position: fixed; inset: 0; z-index: 1; }
    #loader { position: fixed; inset: 0; background: radial-gradient(circle at center, #08090d, #000 70%); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 1s ease; }
    .spinner { width: 62px; height: 62px; border: 1px solid rgba(191,164,95,.22); border-top: 2px solid #d4af37; border-radius: 50%; animation: spin 1s linear infinite; box-shadow: 0 0 26px rgba(191,164,95,.25); }

    .controls-area { pointer-events: auto; display: grid; gap: 14px; justify-items: center; animation: fadeUp 1.2s ease .9s both; }
    .glass-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .glass-btn, .mode-btn, #ui-toggle { border: 1px solid rgba(191,164,95,.42); background: rgba(15,18,24,.62); color: #d4af37; backdrop-filter: blur(14px); box-shadow: 0 10px 30px rgba(0,0,0,.45); font-family: 'Cinzel', serif; cursor: pointer; transition: transform .28s ease, border-color .28s ease, background .28s ease, color .28s ease, box-shadow .28s ease; }

    .glass-btn:hover, .mode-btn:hover, #ui-toggle:hover { transform: translateY(-2px); color: #fff; border-color: rgba(255,255,255,.85); background: rgba(191,164,95,.14); box-shadow: 0 0 38px rgba(191,164,95,.32); }
    .mode-btn.active { color: #fff; border-color: #f2dc92; background: rgba(191,164,95,.18); }
    #file-input { display: none; }
    #ui-toggle { position: fixed; top: 16px; right: 16px; z-index: 40; width: 44px; height: 44px; border-radius: 50%; font-size: 18px; line-height: 42px; text-align: center; pointer-events: auto; }
    #quality-badge { position: fixed; left: 16px; bottom: 16px; z-index: 20; color: rgba(255,255,255,.36); font-size: 10px; letter-spacing: 2px; font-family: 'Cinzel', serif; pointer-events: none; }
    #webcam-hint { position: fixed; right: 26px; bottom: 26px; z-index: 22; width: 140px; height: 105px; border: 1px solid rgba(255,255,255,.15); opacity: 0; transition: opacity .5s; border-radius: 8px; overflow: hidden; background: #000; box-shadow: 0 0 20px rgba(0,0,0,.5); }
    #webcam-canvas { width: 100%; height: 100%; opacity: .72; filter: sepia(.2) contrast(1.1); }
    .gesture-status { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; background: rgba(0,0,0,.78); color: #bfa45f; font: 10px 'Cinzel', serif; padding: 6px 0; letter-spacing: 2px; }
    @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: none; } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @media (max-width: 768px) {
      #ui-layer { padding: 28px 10px 22px; }

      .glass-btn { padding: 12px 24px; font-size: 10px; letter-spacing: 2px; }
      #webcam-hint { width: 104px; height: 78px; right: 12px; bottom: 12px; }
      #quality-badge { display: none; }
      .mode-btn { padding: 8px 11px; }
    }
  </style>

<body>
  <button id="ui-toggle" aria-label="Toggle UI">☰</button>
  <div id="loader"><div class="spinner"></div><div class="loader-text">Growing Memory Garden</div></div>

  <div id="ui-layer">
    <header><h1>MEMORY TREE</h1><div class="subtitle">Floating Memory Garden</div><div class="meta-line">Author tiaotiao · Iteration v3.7</div></header>
    <div class="controls-area">
      <label class="glass-btn">Add Memories<input type="file" id="file-input" multiple accept="image/*"></label>
      <div class="glass-row" aria-label="Scene modes">

    </div>
  </div>
  <div id="webcam-hint"><video id="webcam" autoplay playsinline muted style="display:none"></video><canvas id="webcam-canvas" width="300" height="150"></canvas><div class="gesture-status" id="gesture-text">Initialize AI...</div></div>
  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

    const DEVICE = {
      isMobile: matchMedia('(max-width: 768px), (pointer: coarse)').matches,
      reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches,
      dpr: Math.min(window.devicePixelRatio || 1, matchMedia('(max-width: 768px)').matches ? 1.25 : 1.65)
    };
    const CONFIG = {
      counts: DEVICE.isMobile ? { ornaments: 360, diamonds: 260, gifts: 42, snowflakes: 1200, ribbon: 900, halo: 320 } : { ornaments: 720, diamonds: 560, gifts: 96, snowflakes: 2400, ribbon: 2000, halo: 820 },
      tree: { height: 28, radius: 10 },
      maxPhotos: DEVICE.isMobile ? 18 : 32
    };
    if (DEVICE.reducedMotion) { CONFIG.counts.snowflakes = Math.floor(CONFIG.counts.snowflakes * .45); CONFIG.counts.ribbon = Math.floor(CONFIG.counts.ribbon * .55); }

    const STATE = {
      mode: 'TREE',
      focusTarget: null,
      focusIndex: 0,
      hand: { detected:false, x:0, y:0, palmX:0, lastPalmX:0, flickStartX:null, flickStartY:null, flickStartT:0, flickArmed:false, pinchHeld:false },
      rotation:{x:0,y:0},
      targetRotation:{x:0,y:0},
      time:0,
      snowSpeedMultiplier:1,
      fps:60,
      qualityStep:0
    };
    const GESTURE_SYSTEM = {
      buffer: [],
      bufferSize: 6,
      currentStableGesture: 'NONE',
      lastFire: 0,
      cooldown: 620,
      update(g) {
        const now = performance.now();
        // 拨动是瞬时动作，不走稳定帧投票，否则很容易被缓冲吞掉。
        if ((g === 'FLICK_NEXT' || g === 'FLICK_PREV' || g === 'PINCH') && now - this.lastFire > this.cooldown) {
          this.buffer.length = 0;
          this.currentStableGesture = 'NONE';
          this.lastFire = now;
          return g;
        }
        this.buffer.push(g);
        if (this.buffer.length > this.bufferSize) this.buffer.shift();
        const counts = {};
        for (const x of this.buffer) counts[x] = (counts[x] || 0) + 1;
        let consensus = 'NONE';
        let best = 0;
        for (const [key, val] of Object.entries(counts)) {
          if (val > best) { best = val; consensus = key; }
        }
        if (best < 4) return null;
        if (consensus === 'NONE') {
          this.currentStableGesture = 'NONE';
          return null;
        }
        if (consensus !== this.currentStableGesture && now - this.lastFire > this.cooldown) {
          this.currentStableGesture = consensus;
          this.lastFire = now;
          return consensus;
        }
        return null;
      },
      reset() {
        this.buffer.length = 0;
        this.currentStableGesture = 'NONE';
      }
    };

    let scene, camera, renderer, composer, bloomPass, mainGroup, nebulaMesh, snowSystem, handLandmarker, video, coreLight;
    let mediaPipeRunning = false;
    const clock = new THREE.Clock();
    const instanceBatches = [];
    const photos = [];
    const gifts = [];
    let uploadedPhotoCount = 0;
    const dummy = new THREE.Object3D();
    const tempVec = new THREE.Vector3();
    const tempQuat = new THREE.Quaternion();

    const nebulaVertexShader = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
    const nebulaFragmentShader = `uniform float time; varying vec2 vUv; float hash(vec2 p){return fract(1e4*sin(17.0*p.x+p.y*.1)*(.1+abs(sin(p.y*13.0+p.x))));} float noise(vec2 x){vec2 i=floor(x);vec2 f=fract(x);float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));vec2 u=f*f*(3.0-2.0*f);return mix(a,b,u.x)+(c-a)*u.y*(1.0-u.x)+(d-b)*u.x*u.y;} float fbm(vec2 x){float v=0.,a=.5;vec2 s=vec2(100);mat2 r=mat2(cos(.5),sin(.5),-sin(.5),cos(.5));for(int i=0;i<4;i++){v+=a*noise(x);x=r*x*2.0+s;a*=.5;}return v;} void main(){vec2 uv=vUv*2.0-1.0;float t=time*.02;float r=fbm(uv+vec2(t,0));float g=fbm(uv*1.5+vec2(0,t*1.1));float b=fbm(uv*2.0-vec2(t));vec3 col=mix(vec3(0,0,.02),vec3(.05,.02,.1),r);col=mix(col,vec3(0,.1,.2),g*.4);col+=vec3(.5,.4,.1)*pow(b*r,4.0)*.5;float vig=1.0-length(uv*.6);col*=smoothstep(0.0,1.2,vig);gl_FragColor=vec4(col,1);}`;
    const snowVertexShader = `uniform float time; uniform float speedMultiplier; attribute float size; attribute vec3 velocity; varying float vOpacity; void main(){vec3 pos=position;pos.y=mod(pos.y-time*velocity.y*speedMultiplier+40.0,80.0)-40.0;float angle=time*velocity.x*speedMultiplier*.5;pos.x+=cos(angle)*2.0;pos.z+=sin(angle)*2.0;vec4 mv=modelViewMatrix*vec4(pos,1.0);gl_PointSize=size*(30.0/-mv.z);gl_Position=projectionMatrix*mv;vOpacity=smoothstep(0.0,10.0,-mv.z);}`;
    const snowFragmentShader = `varying float vOpacity; void main(){vec2 c=gl_PointCoord*2.0-1.0;float d=length(c);if(d>1.0) discard;vec3 col=mix(vec3(1.0,.78,.36), vec3(.58,.82,1.0), gl_PointCoord.y); gl_FragColor=vec4(col,(1.0-d)*.68*vOpacity);}`;

    const materials = {};
    function makeMaterialLibrary(){
      materials.gold = new THREE.MeshStandardMaterial({ color:0xd4af37, metalness:1, roughness:.2, envMapIntensity:3 });
      materials.red = new THREE.MeshPhysicalMaterial({ color:0xd45d6e, metalness:.18, roughness:.5, sheen:1.35, sheenColor:0xffc7d0, clearcoat:.12 });
      materials.green = new THREE.MeshPhysicalMaterial({ color:0x1b8d78, metalness:.18, roughness:.48, sheen:1.35, sheenColor:0x9cf0d4, clearcoat:.12 });
      materials.orange = new THREE.MeshPhysicalMaterial({ color:0xc98a32, metalness:.22, roughness:.44, sheen:1.25, sheenColor:0xffe2a6, clearcoat:.14 });
      materials.ice = new THREE.MeshPhysicalMaterial({ color:0xaaddff, metalness:.08, roughness:.12, transmission:.55, thickness:.8, ior:1.33, envMapIntensity:2 });
      materials.diamond = new THREE.MeshPhysicalMaterial({ color:0xffffff, roughness:0, transmission:.8, thickness:1.6, ior:2.2, envMapIntensity:4.5, emissive:0xffffff, emissiveIntensity:.12 });
      materials.ribbon = new THREE.MeshBasicMaterial({ color:0x8fd8ff, transparent:true, opacity:.58, side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending });
    }
    function treePos(t, rBase=CONFIG.tree.radius, h=CONFIG.tree.height){ const y=t*h-h/2; const r=rBase*(1-t); const a=t*24*Math.PI; return new THREE.Vector3(Math.cos(a)*r,y,Math.sin(a)*r); }
    function scatterPos(){ const u=Math.random(), v=Math.random(), th=2*Math.PI*u, ph=Math.acos(2*v-1), r=12+Math.random()*12; return new THREE.Vector3(r*Math.sin(ph)*Math.cos(th), r*Math.sin(ph)*Math.sin(th), r*Math.cos(ph)); }

    class InstanceBatch {
      constructor(name, geometry, material, capacity){
        this.name = name;
        this.mesh = new THREE.InstancedMesh(geometry, material, capacity);
        this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        this.mesh.frustumCulled = false;
        this.items = [];
        mainGroup.add(this.mesh);
        instanceBatches.push(this);
      }
      add(item){
        item.current = item.posTree.clone();
        item.currentScale = item.baseScale ?? 1;
        item.rotation = item.rotation || new THREE.Euler(Math.random(), Math.random(), Math.random());
        this.items.push(item);
      }
      update(dt){
        const isScatter = STATE.mode === 'SCATTER';
        const isFocus = STATE.mode === 'FOCUS' || STATE.mode === 'SHOW_ALL';
        const camQuat = camera.quaternion;
        const hideScale = isFocus ? .08 : 1;
        for(let i=0; i<this.items.length; i++){
          const p = this.items[i];
          let target = p.posTree;
          let targetScale = p.baseScale ?? 1;
          if(isFocus){ target = p.posScatter; targetScale *= hideScale; }
          else if(isScatter){ target = p.posScatter; }
          else if(p.kind === 'HALO'){
            p.angle += p.orbitSpeed * dt * .5;
            tempVec.set(Math.cos(p.angle)*p.radius, p.y, Math.sin(p.angle)*p.radius).applyAxisAngle(p.axis, p.tilt);
            target = tempVec;
          } else if(p.kind === 'RIBBON'){
            p.posTree.y = p.baseY + Math.sin(STATE.time*2 + p.phase) * .2;
            target = p.posTree;
          }
          p.current.lerp(target, Math.min(1, 3.6*dt));
          p.currentScale = THREE.MathUtils.lerp(p.currentScale, targetScale, Math.min(1, 3.0*dt));
          if(isScatter && p.kind !== 'RIBBON' && p.kind !== 'HALO'){ p.rotation.x += p.spin.x*dt; p.rotation.y += p.spin.y*dt; }
          else if(p.kind === 'DIAMOND'){ p.rotation.y += dt*.85; p.rotation.z += dt*.42; }
          else if(p.kind === 'RIBBON'){ dummy.position.copy(p.current); dummy.lookAt(0, p.current.y, 0); dummy.updateMatrix(); this.mesh.setMatrixAt(i, dummy.matrix); continue; }
          else if(p.kind === 'HALO'){ tempQuat.copy(camQuat); dummy.quaternion.copy(tempQuat); dummy.position.copy(p.current); dummy.scale.setScalar(p.currentScale); dummy.updateMatrix(); this.mesh.setMatrixAt(i, dummy.matrix); continue; }
          dummy.position.copy(p.current); dummy.rotation.copy(p.rotation); dummy.scale.setScalar(p.currentScale); dummy.updateMatrix(); this.mesh.setMatrixAt(i, dummy.matrix);
        }
        this.mesh.count = this.items.length;
        this.mesh.instanceMatrix.needsUpdate = true;
      }
    }

    function initThree(){
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, .1, 300); camera.position.z = 60;
      renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false, powerPreference:'high-performance' });
      renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(DEVICE.dpr); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.18;
      container.appendChild(renderer.domElement);
      mainGroup = new THREE.Group(); scene.add(mainGroup);
      scene.add(new THREE.AmbientLight(0xffffff, .12));
      coreLight = new THREE.PointLight(0x9fd7ff, 4.2, 52); coreLight.position.set(0,5,0); mainGroup.add(coreLight);
      const goldSpot = new THREE.SpotLight(0xf0c979, 1500); goldSpot.position.set(30,40,30); goldSpot.angle=.6; scene.add(goldSpot);
      const iceSpot = new THREE.SpotLight(0x9bdcff, 1100); iceSpot.position.set(-30,20,-30); scene.add(iceSpot);
      const pmrem = new THREE.PMREMGenerator(renderer); scene.environment = pmrem.fromScene(new RoomEnvironment()).texture; pmrem.dispose();
    }
    function createBackground(){ const geo=new THREE.PlaneGeometry(300,180); const mat=new THREE.ShaderMaterial({vertexShader:nebulaVertexShader,fragmentShader:nebulaFragmentShader,uniforms:{time:{value:0}},depthWrite:false}); nebulaMesh=new THREE.Mesh(geo,mat); nebulaMesh.position.z=-80; scene.add(nebulaMesh); }
    function createSnow(){
      const geo=new THREE.BufferGeometry(), pos=[], vel=[], size=[];
      for(let i=0;i<CONFIG.counts.snowflakes;i++){ pos.push((Math.random()-.5)*80,(Math.random()-.5)*80,(Math.random()-.5)*80); vel.push((Math.random()-.5),1+Math.random(),0); size.push(.2+Math.random()*.42); }
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3)); geo.setAttribute('velocity', new THREE.Float32BufferAttribute(vel,3)); geo.setAttribute('size', new THREE.Float32BufferAttribute(size,1));
      const mat=new THREE.ShaderMaterial({uniforms:{time:{value:0},speedMultiplier:{value:1}},vertexShader:snowVertexShader,fragmentShader:snowFragmentShader,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
      snowSystem = new THREE.Points(geo, mat); scene.add(snowSystem);
    }
    function createContent(){
      const sphereGeo = new THREE.SphereGeometry(.5, DEVICE.isMobile ? 12 : 16, DEVICE.isMobile ? 10 : 16);
      const diamondGeo = new THREE.OctahedronGeometry(.35,0);
      const planeGeo = new THREE.PlaneGeometry(.15,.15);
      const batches = {
        gold: new InstanceBatch('gold ornaments', sphereGeo, materials.gold, CONFIG.counts.ornaments),
        red: new InstanceBatch('rose ornaments', sphereGeo, materials.red, CONFIG.counts.ornaments),
        green: new InstanceBatch('teal ornaments', sphereGeo, materials.green, CONFIG.counts.ornaments),
        orange: new InstanceBatch('amber ornaments', sphereGeo, materials.orange, CONFIG.counts.ornaments),
        ice: new InstanceBatch('ice ornaments', sphereGeo, materials.ice, CONFIG.counts.ornaments),
        diamond: new InstanceBatch('diamonds', diamondGeo, materials.diamond, CONFIG.counts.diamonds),
        ribbon: new InstanceBatch('ribbon light', planeGeo, materials.ribbon, CONFIG.counts.ribbon),
        halo: new InstanceBatch('celestial halos', planeGeo, materials.ribbon, CONFIG.counts.halo)
      };
      for(let i=0;i<CONFIG.counts.ornaments;i++){
        const t=Math.random(); const pos=treePos(t).add(new THREE.Vector3((Math.random()-.5)*2.5,(Math.random()-.5)*1.5,(Math.random()-.5)*2.5)); const r=Math.random();
        const batch = r<.22 ? batches.red : (r<.42 ? batches.green : (r<.6 ? batches.orange : (r<.8 ? batches.ice : batches.gold)));
        batch.add({kind:'ORNAMENT', posTree:pos, posScatter:scatterPos(), baseScale:.3+Math.random()*.5, spin:new THREE.Vector3(Math.random()-.5,Math.random()-.5,0).multiplyScalar(1.5)});
      }
      for(let i=0;i<CONFIG.counts.diamonds;i++){ const t=Math.random(); const pos=treePos(t, CONFIG.tree.radius+1); batches.diamond.add({kind:'DIAMOND', posTree:pos, posScatter:scatterPos(), baseScale:1, spin:new THREE.Vector3(Math.random()-.5,Math.random()-.5,0).multiplyScalar(1.5)}); }
      for(let i=0;i<CONFIG.counts.ribbon;i++){ const t=i/CONFIG.counts.ribbon; const y=t*CONFIG.tree.height-CONFIG.tree.height/2; const r=(CONFIG.tree.radius+1.2)*(1-t+.1); const a=t*30*Math.PI; const pos=new THREE.Vector3(Math.cos(a)*r,y,Math.sin(a)*r); batches.ribbon.add({kind:'RIBBON', posTree:pos, posScatter:scatterPos(), baseScale:1, baseY:y, phase:i*.05}); }
      for(let i=0;i<CONFIG.counts.halo;i++){ const ring=i%3; const angle=Math.random()*Math.PI*2; const radius=14+ring*4; const y=(ring-1)*8; const axis=new THREE.Vector3(1,0,1).normalize(); const tilt=Math.PI*.1*(ring+1); const pos=new THREE.Vector3(Math.cos(angle)*radius,y,Math.sin(angle)*radius).applyAxisAngle(axis,tilt); batches.halo.add({kind:'HALO', posTree:pos, posScatter:scatterPos(), baseScale:1, angle, radius, y, axis, tilt, orbitSpeed:.5+Math.random()*.5}); }
      createGifts();
      const memorySeed=new THREE.Group();

    function dist2D(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
    function dist3D(a,b){ return Math.hypot(a.x-b.x, a.y-b.y, (a.z||0)-(b.z||0)); }
    function palmSize(lm){ return Math.max(0.001, dist3D(lm[0], lm[9])); }
    function fingerIsOpen(lm, tip, pip, mcp){
      const palm = palmSize(lm);
      const tipDist = dist3D(lm[tip], lm[0]) / palm;
      const pipDist = dist3D(lm[pip], lm[0]) / palm;
      const mcpDist = dist3D(lm[mcp], lm[0]) / palm;
      return tipDist > pipDist * 1.08 && tipDist > mcpDist * 1.32;
    }
    function classifyHand(lm){
      const palm = palmSize(lm);

      const index = fingerIsOpen(lm,8,6,5);
      const middle = fingerIsOpen(lm,12,10,9);
      const ring = fingerIsOpen(lm,16,14,13);
      const pinky = fingerIsOpen(lm,20,18,17);
      const openCount = [index,middle,ring,pinky].filter(Boolean).length;

      const thumbIndex = dist3D(lm[4], lm[8]) / palm;
      const thumbMiddle = dist3D(lm[4], lm[12]) / palm;
      const thumbRing = dist3D(lm[4], lm[16]) / palm;
      const thumbPinky = dist3D(lm[4], lm[20]) / palm;

      const indexPalm = dist3D(lm[8], lm[0]) / palm;
      const middlePalm = dist3D(lm[12], lm[0]) / palm;
      const ringPalm = dist3D(lm[16], lm[0]) / palm;
      const pinkyPalm = dist3D(lm[20], lm[0]) / palm;
      const avgFingerPalm = (indexPalm + middlePalm + ringPalm + pinkyPalm) / 4;
      const indexPipPalm = dist3D(lm[6], lm[0]) / palm;

      // 关键修复：握拳时，拇指和食指也可能很近，所以不能只用 thumbIndex 判断捏合。
      // 先判断“整只手是否收成拳”：四根手指整体靠近掌心，且几乎没有手指伸展。
      const allFingersNearPalm = indexPalm < 1.05 && middlePalm < 1.12 && ringPalm < 1.12 && pinkyPalm < 1.12;
      const fistLikely = openCount === 0 && avgFingerPalm < 1.16 && allFingersNearPalm;

      // 🤌 捏合：拇指尖和食指尖很近，但食指不能像握拳一样完全缩回掌心。
      // 这样可以把“捏合”与“握拳”分开。
      const indexNotBuried = indexPalm > 0.98 && indexPalm > indexPipPalm * 0.92;
      const otherFingersNotAllBuried = (middlePalm + ringPalm + pinkyPalm) / 3 > 0.96;
      const thumbIndexPinch = thumbIndex < 0.36 && indexNotBuried && otherFingersNotAllBuried;

      // 兼容三指捏合：拇指靠近食指/中指，但仍然排除拳头。
      const multiTipPinch = thumbIndex < 0.42 && thumbMiddle < 0.48 && indexPalm > 0.94 && middlePalm > 0.94 && !fistLikely;

      if(!fistLikely && (thumbIndexPinch || multiTipPinch)) return 'PINCH';
      if(openCount >= 3) return 'OPEN';
      if(fistLikely || (openCount <= 1 && avgFingerPalm < 1.08)) return 'FIST';

    const THEMES = {
      fresh: { name:'清新蓝金', gold:0xd4af37, red:0xff6f86, green:0x1b8d78, orange:0xc98a32, ice:0xaaddff, ribbon:0x8fd8ff, core:0x9fd7ff, diamondEmissive:0xdff6ff },
      dream: { name:'梦幻紫金', gold:0xe0c886, red:0x9c6bff, green:0x34c7b5, orange:0xd09b55, ice:0xd8c4ff, ribbon:0xd8c4ff, core:0xd9b8ff, diamondEmissive:0xf3e8ff },
      autumn: { name:'暖色秋日', gold:0xffc86b, red:0xd85c3f, green:0x5f7f55, orange:0xe08f3e, ice:0xffdfaa, ribbon:0xffc36a, core:0xffb35a, diamondEmissive:0xffefd0 },
      cyber: { name:'赛博霓虹', gold:0xffd600, red:0xff3df2, green:0x00ffe1, orange:0xff8a00, ice:0x7a7cff, ribbon:0x00d7ff, core:0x00f5ff, diamondEmissive:0xe9fcff }
    };
    function applyTheme(name='fresh'){
      const t = THEMES[name] || THEMES.fresh;
      if(materials.gold) materials.gold.color.setHex(t.gold);
      if(materials.red){ materials.red.color.setHex(t.red); if(materials.red.sheenColor) materials.red.sheenColor.setHex(t.red); }
      if(materials.green){ materials.green.color.setHex(t.green); if(materials.green.sheenColor) materials.green.sheenColor.setHex(t.green); }
      if(materials.orange){ materials.orange.color.setHex(t.orange); if(materials.orange.sheenColor) materials.orange.sheenColor.setHex(t.orange); }
      if(materials.ice) materials.ice.color.setHex(t.ice);
      if(materials.ribbon) materials.ribbon.color.setHex(t.ribbon);
      if(materials.diamond && materials.diamond.emissive) materials.diamond.emissive.setHex(t.diamondEmissive);
      if(coreLight) coreLight.color.setHex(t.core);
      const badge = document.getElementById('quality-badge');
      if(badge) badge.textContent = `AUTO QUALITY · MEMORY TREE · tiaotiao · v3.7 · ${t.name}`;
    }

    function setupEvents(){
      const toggleUI=()=>document.getElementById('ui-layer').classList.toggle('ui-hidden'); document.getElementById('ui-toggle').addEventListener('click', toggleUI);
      document.querySelectorAll('.mode-btn[data-mode]').forEach(btn=>btn.addEventListener('click',()=>setMode(btn.dataset.mode)));
      const nextBtn=document.querySelector('[data-action="NEXT_PHOTO"]'); if(nextBtn) nextBtn.addEventListener('click',()=>nextPhoto(1));
      const resetBtn=document.querySelector('[data-action="RESET_PHOTOS"]'); if(resetBtn) resetBtn.addEventListener('click',resetPhotos);
      const startCamBtn=document.querySelector('[data-action="START_CAMERA"]'); if(startCamBtn) startCamBtn.addEventListener('click',initMediaPipe);
      const themeSelect=document.getElementById('theme-select'); if(themeSelect) themeSelect.addEventListener('change',()=>applyTheme(themeSelect.value));
      let resizeTimer=0; addEventListener('resize',()=>{ clearTimeout(resizeTimer); resizeTimer=setTimeout(()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight); },120); });
      document.getElementById('file-input').addEventListener('change', e=>{ const files=Array.from(e.target.files||[]).slice(0, Math.max(0, CONFIG.maxPhotos-uploadedPhotoCount)); if(!files.length) return; files.forEach(f=>{ const r=new FileReader(); r.onload=ev=>{ new THREE.TextureLoader().load(ev.target.result, t=>{ uploadedPhotoCount++; addPhotoMesh(t); }, undefined, err=>console.warn('Texture load failed:',err)); }; r.readAsDataURL(f); }); e.target.value=''; });
      addEventListener('keydown', e=>{ const k=e.key.toLowerCase(); if(k==='h') toggleUI(); if(k==='1') setMode('TREE'); if(k==='2') setMode('SCATTER'); if(k==='3') setMode('FOCUS'); if(k==='4') setMode('SHOW_ALL'); if(k==='n' || k==='arrowright') nextPhoto(1); if(k==='arrowleft') nextPhoto(-1); if(k==='r') resetPhotos(); if(k==='escape') document.getElementById('ui-layer').classList.remove('ui-hidden'); });
    }
    async function init(){ initThree(); createBackground(); makeMaterialLibrary(); applyTheme("fresh"); createContent(); createSnow(); setupPostProcessing(); setupEvents(); animate(); setTimeout(()=>{ const l=document.getElementById('loader'); l.style.opacity=0; setTimeout(()=>l.remove(),1000); },650); initMediaPipe(); }
    init();
  </script>
</body>
</html>
